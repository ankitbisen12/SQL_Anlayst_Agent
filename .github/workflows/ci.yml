name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the LLM evaluation suite (uses OPENAI_API_KEY secret)"
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t airbnb-sql-analyst:${{ github.sha }} .

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airbnb_admin
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_DB: airbnb
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://airbnb_admin:ci_admin@localhost:5432/airbnb
      ANALYST_RO_PASSWORD: ci_ro
      DATABASE_URL: postgresql://analyst_ro:ci_ro@localhost:5432/airbnb
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python db/setup_db.py
      - run: uv run python evals/run_evals.py --min-accuracy 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
